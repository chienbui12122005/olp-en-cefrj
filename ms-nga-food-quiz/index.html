<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ms. Nga - Food & Grammar Quiz</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f8fb;color:#1c2430}.w{max-width:860px;margin:auto;padding:18px 12px 50px}.hero,.q,.score{background:white;border:1px solid #e4e7ec;border-radius:18px}.hero{padding:20px;text-align:center}h1{margin:0 0 6px;font-size:30px}.hero p{margin:5px;color:#667085}.prog{position:sticky;top:0;background:#f6f8fb;padding:10px 0;z-index:5}.track{height:9px;background:#e9edf5;border-radius:20px;overflow:hidden}#bar{height:100%;width:0;background:#175cd3}#count{font-size:13px;color:#667085;text-align:right;margin-top:5px}h2{font-size:19px;margin:25px 3px 8px}.q{display:grid;grid-template-columns:100px 1fr;gap:14px;align-items:center;padding:15px;margin:10px 0}.emo{font-size:66px;text-align:center}.n{font-size:12px;color:#667085;font-weight:bold}.p{font-size:17px;font-weight:bold;line-height:1.4;margin:5px 0 10px}.opts{display:grid;gap:7px}label{border:1px solid #dfe3ea;border-radius:11px;padding:10px;display:flex;gap:8px;align-items:center}input[type=text]{width:100%;padding:12px;border:1px solid #cfd5df;border-radius:11px;font-size:16px}.fb{font-size:14px;margin-top:8px;min-height:18px}.ok{border-color:#75c9a7!important;background:#f0fdf4}.bad{border-color:#f2a19a!important;background:#fff4f2}.act{display:flex;gap:10px;justify-content:center;margin:22px 0}button{padding:13px 18px;border:0;border-radius:11px;font-weight:bold;font-size:16px;cursor:pointer}.pri{background:#175cd3;color:white}.sec{background:white;border:1px solid #dfe3ea}.score{display:none;padding:20px;text-align:center}.score strong{font-size:34px;display:block}@media(max-width:560px){.q{grid-template-columns:72px 1fr}.emo{font-size:50px}h1{font-size:24px}}
</style></head><body><div class="w"><div class="hero"><h1>PHIẾU BỔ TRỢ - MS. NGA</h1><p><b>Food & Grammar: How many / How much</b> - Level Movers</p><p>24 câu · Có hình minh họa · Chấm điểm tự động · Không cần tài khoản</p></div><div class="prog"><div class="track"><div id="bar"></div></div><div id="count">0/24 câu đã làm</div></div><div id="root"></div><div class="act"><button class="pri" onclick="grade()">Nộp bài & chấm điểm</button><button class="sec" onclick="resetQ()">Làm lại</button></div><div id="score" class="score"></div></div><script>
const Q=[{"id":"q1","p":"How _____ cheese is there in the fridge?","t":"mcq","e":"🧀","o":["many","much","any"],"a":"much"},{"id":"q2","p":"How _____ sausages are on the plate?","t":"mcq","e":"🌭","o":["much","many","some"],"a":"many"},{"id":"q3","p":"There isn't _____ water left in the bottle.","t":"mcq","e":"💧","o":["many","some","much"],"a":"much"},{"id":"q4","p":"How _____ tomatoes do you need for the pasta?","t":"mcq","e":"🍅","o":["many","much","any"],"a":"many"},{"id":"q5","p":"How _____ rice do you want for lunch?","t":"mcq","e":"🍚","o":["many","much","a lot"],"a":"much"},{"id":"q6","p":"Sửa câu sai: How many soup is there in the bowl?","t":"text","e":"🍲","a":["How much soup is there in the bowl"]},{"id":"q7","p":"Sửa câu sai: I bought five waters from the supermarket.","t":"text","e":"🧴","a":["I bought five bottles of water from the supermarket","I bought five bottles of water at the supermarket"]},{"id":"q8","p":"Sửa câu sai: How much eggs do we need for the cake?","t":"text","e":"🥚","a":["How many eggs do we need for the cake"]},{"id":"q9","p":"Sửa câu sai: There are much bananas in the bag.","t":"text","e":"🍌","a":["There are many bananas in the bag","There are a lot of bananas in the bag"]},{"id":"q10","p":"Sửa câu sai: How many butter do you want on your bread?","t":"text","e":"🧈","a":["How much butter do you want on your bread"]},{"id":"q11","p":"Sắp xếp: do / How / you / much / juice / want / ?","t":"text","e":"🧃","a":["How much juice do you want"]},{"id":"q12","p":"Sắp xếp: are / there / How / burgers / many / ?","t":"text","e":"🍔","a":["How many burgers are there"]},{"id":"q13","p":"Sắp xếp: lot / a / of / We / pancakes / have / .","t":"text","e":"🥞","a":["We have a lot of pancakes"]},{"id":"q14","p":"Sắp xếp: she / How / does / sugar / need / much / ?","t":"text","e":"🍬","a":["How much sugar does she need"]},{"id":"q15","p":"_____ chicken is there for dinner?","t":"mcq","e":"🍗","o":["How many","How much"],"a":"How much"},{"id":"q16","p":"_____ pears are in the basket?","t":"mcq","e":"🍐","o":["How many","How much"],"a":"How many"},{"id":"q17","p":"_____ lemonade is left in the pitcher?","t":"mcq","e":"🍋","o":["How many","How much"],"a":"How much"},{"id":"q18","p":"_____ carrots do you need for the soup?","t":"mcq","e":"🥕","o":["How many","How much"],"a":"How many"},{"id":"q19","p":"_____ flour do we need to make bread?","t":"mcq","e":"🌾","o":["How many","How much"],"a":"How much"},{"id":"q20","p":"_____ potatoes did your mom buy?","t":"mcq","e":"🥔","o":["How many","How much"],"a":"How many"},{"id":"q21","p":"Đặt câu hỏi cho phần in đậm: I have THREE ICE CREAMS.","t":"text","e":"🍨","a":["How many ice creams do you have"]},{"id":"q22","p":"Đặt câu hỏi cho phần in đậm: There is A LOT OF TEA in the teapot.","t":"text","e":"🫖","a":["How much tea is there in the teapot"]},{"id":"q23","p":"Đặt câu hỏi cho phần in đậm: They ate FOUR HOT DOGS at the party.","t":"text","e":"🌭","a":["How many hot dogs did they eat at the party"]},{"id":"q24","p":"Đặt câu hỏi cho phần in đậm: She wants A LITTLE PASTA for dinner.","t":"text","e":"🍝","a":["How much pasta does she want for dinner"]}], sections={0:"Phần 1 - Chọn đáp án đúng",5:"Phần 2 - Sửa lỗi sai",10:"Phần 3 - Sắp xếp câu",14:"Phần 4 - How many / How much",20:"Phần 5 - Tự đặt câu hỏi"};
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[?.!,;:]+$/g,"").replace(/\s+/g," ").trim();
function get(q){if(q.t==="mcq"){let x=document.querySelector(`input[name="${q.id}"]:checked`);return x?x.value:""}return document.getElementById(q.id).value||""}
function good(q,v){return Array.isArray(q.a)?q.a.some(x=>norm(x)===norm(v)):norm(q.a)===norm(v)}
function render(){let r=document.getElementById("root");r.innerHTML="";Q.forEach((q,i)=>{if(sections[i]){let h=document.createElement("h2");h.textContent=sections[i];r.appendChild(h)}let d=document.createElement("div");d.className="q";d.id="c"+q.id;let a=document.createElement("div");a.className="emo";a.textContent=q.e;let b=document.createElement("div");b.innerHTML=`<div class="n">Câu ${i+1} / ${Q.length}</div><div class="p">${q.p}</div>`;if(q.t==="mcq"){let o=document.createElement("div");o.className="opts";q.o.forEach((x,j)=>{let l=document.createElement("label");l.innerHTML=`<input type="radio" name="${q.id}" value="${x}"> ${String.fromCharCode(65+j)}. ${x}`;o.appendChild(l)});b.appendChild(o)}else{let inp=document.createElement("input");inp.type="text";inp.id=q.id;inp.placeholder="Nhập câu trả lời...";b.appendChild(inp)}let f=document.createElement("div");f.className="fb";f.id="f"+q.id;b.appendChild(f);d.append(a,b);r.appendChild(d)});document.querySelectorAll("input").forEach(x=>x.addEventListener("change",progress));document.querySelectorAll('input[type=text]').forEach(x=>x.addEventListener("input",progress));restore();progress()}
function progress(){let n=0,s={};Q.forEach(q=>{let v=get(q);if(norm(v))n++;s[q.id]=v});localStorage.setItem("msnga_quiz",JSON.stringify(s));bar.style.width=(n/Q.length*100)+"%";count.textContent=n+"/"+Q.length+" câu đã làm"}
function restore(){try{let s=JSON.parse(localStorage.getItem("msnga_quiz")||"{}");Q.forEach(q=>{let v=s[q.id];if(!v)return;if(q.t==="mcq"){let x=[...document.querySelectorAll(`input[name="${q.id}"]`)].find(y=>y.value===v);if(x)x.checked=true}else document.getElementById(q.id).value=v})}catch(e){}}
function grade(){let c=0,a=0;Q.forEach(q=>{let v=get(q),d=document.getElementById("c"+q.id),f=document.getElementById("f"+q.id);d.classList.remove("ok","bad");if(!norm(v)){f.textContent="Chưa trả lời.";f.style.color="#667085";return}a++;if(good(q,v)){c++;d.classList.add("ok");f.textContent="✓ Chính xác";f.style.color="#067647"}else{d.classList.add("bad");f.textContent="✗ Đáp án gợi ý: "+(Array.isArray(q.a)?q.a[0]:q.a);f.style.color="#b42318"}});let p=Math.round(c/Q.length*100),m=p>=90?"Xuất sắc!":p>=75?"Rất tốt!":p>=60?"Khá tốt, ôn thêm một chút nhé.":"Cần ôn lại How many / How much.";score.style.display="block";score.innerHTML=`<strong>${c}/${Q.length} · ${p}%</strong><div>${m}</div><div style="color:#667085;margin-top:6px">Đã trả lời ${a}/${Q.length} câu.</div>`;score.scrollIntoView({behavior:"smooth"})}
function resetQ(){if(confirm("Xóa toàn bộ câu trả lời và làm lại?")){localStorage.removeItem("msnga_quiz");render();score.style.display="none";scrollTo(0,0)}}render();
</script></body></html>
